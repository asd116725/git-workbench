name: Windows x64 桌面交互验收

on:
  push:
    branches: ['codex/windows-build-v1.8.1']
    paths:
      - '.github/workflows/windows-x64-ui.yml'
      - 'scripts/ci/windows-smoke.py'

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: 验证已安装应用和 Git 操作
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: 保持源文件换行一致
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: git-workbench-v1.8.1-windows-x64-preview
          path: windows-package
          github-token: ${{ github.token }}
          run-id: 41615408670
      - name: 核验并安装打包产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem 'windows-package' -Filter '*_setup.exe' -File).FullName
          $info = Get-Content 'windows-package/BUILD-INFO.json' -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $info.sha256 -or $info.sourceCommit -ne '603032b80cd20af41ce82d650ecf0794ae15674e' -or $info.baseCommit -ne '35844c40db8d6d0527df4410dc0b3c4f7db593b5') { throw 'Installer checksum or source commit mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'git-workbench-ui'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -PassThru
          if (-not $setup.WaitForExit(120000)) { Stop-Process -Id $setup.Id -Force; throw 'Installer timed out' }
          if ($setup.ExitCode -ne 0) { throw "Installer failed with code $($setup.ExitCode)" }
          $apps = @(Get-ChildItem $destination -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -in @('git-workbench.exe', '代码管理.exe') })
          if ($apps.Count -ne 1) { throw "Expected one app executable; found $($apps.Count)" }
          "WINDOWS_APP_EXE=$($apps[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 准备 Windows WebView 驱动
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeKeys = @(
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimeVersion = @($runtimeKeys | ForEach-Object {
            (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' }) | Select-Object -First 1
          if ($runtimeVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'WebView2 Runtime version unavailable' }
          $driverZip = Join-Path $env:RUNNER_TEMP 'webview2-driver.zip'
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'webview2-driver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtimeVersion/edgedriver_win64.zip" -OutFile $driverZip
          Expand-Archive -Path $driverZip -DestinationPath $driverDirectory
          $nativeDriver = (Get-ChildItem $driverDirectory -Recurse -Filter 'msedgedriver.exe' -File | Select-Object -First 1).FullName
          if (-not $nativeDriver) { throw 'WebView2 WebDriver unavailable' }
          & $nativeDriver --version
          "WINDOWS_EDGE_DRIVER=$nativeDriver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(Join-Path $env:USERPROFILE '.cargo/bin')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 验证应用界面与临时 Git 仓库
        env:
          PYTHONUTF8: '1'
        run: python scripts/ci/windows-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-workbench-v1.8.1-windows-ui-evidence
          path: release-artifacts/windows-ui-proof/
          if-no-files-found: warn
          retention-days: 30
