[package]
name = "git-workbench"
version = "1.7.0"
description = "本地 Git 仓库管理桌面工具"
edition = "2024"
license = "MIT"
repository = "https://github.com/asd116725/git-workbench"

[lib]
# Windows 平台需要区分库与可执行文件的名称。
name = "git_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
notify = "8"
tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
tokio = { version = "=1.53.3", features = ["sync", "time", "macros"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
